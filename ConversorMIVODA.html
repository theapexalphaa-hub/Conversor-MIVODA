<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conversor MIVODA</title>
<style>
:root{--teal:#055960;--teal2:#044850;--orange:#FAB347;--bg:#e9f1f1;--card:#fff;--text:#0c2e32;--muted:#5b7477;--line:#d5e3e3;--soft:#f3f8f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#032e33;--card:#0a3f45;--text:#eaf6f6;--muted:#9bbcbf;--line:#145a61;--soft:#07363c}}
:root[data-theme="dark"]{--bg:#032e33;--card:#0a3f45;--text:#eaf6f6;--muted:#9bbcbf;--line:#145a61;--soft:#07363c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{background:var(--teal);color:#fff;padding:18px 16px 70px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.brand{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto}
.brand img{width:52px;height:52px;border-radius:14px;box-shadow:0 2px 10px #0005}
.brand h1{font-size:1.35rem;margin:0;letter-spacing:.5px}
.brand h1 span{color:var(--orange)}
.brand p{margin:2px 0 0;font-size:.8rem;opacity:.8}
.theme{margin-left:auto;background:#ffffff22;border:0;color:#fff;border-radius:10px;width:38px;height:38px;font-size:1.1rem;cursor:pointer}
main{margin-top:-52px;padding-bottom:30px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 8px 28px #04303533;margin-bottom:16px}
label.lbl{display:block;font-weight:700;font-size:.85rem;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.6px}
.money{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;background:var(--soft);padding:0 14px;transition:.15s}
.money:focus-within{border-color:var(--orange);box-shadow:0 0 0 4px #fab34744}
.money b{color:var(--muted);font-size:1.2rem}
.money input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:1.9rem;font-weight:700;padding:12px 8px;outline:none;width:100%}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.cat{position:relative}
.cat input{position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%;margin:0}
.cat div{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--soft);transition:.15s;height:100%}
.cat strong{display:block;font-size:1.5rem;color:var(--teal)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cat strong{color:var(--orange)}}
:root[data-theme="dark"] .cat strong{color:var(--orange)}
.cat span{font-size:.8rem;color:var(--muted)}
.cat input:checked+div{border-color:var(--orange);background:#fab34726;box-shadow:0 0 0 3px #fab34755}
.cat input:focus-visible+div{outline:3px solid var(--orange)}
.custom{display:none;margin-top:10px}
.custom.on{display:block}
.custom .money input{font-size:1.2rem}
.actions{display:flex;gap:10px;margin-top:18px}
button.btn{flex:1;border:0;border-radius:14px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;transition:.15s}
.btn.pri{background:var(--orange);color:#3a2500}
.btn.sec{background:var(--soft);color:var(--text);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.97)}
.result{display:none;background:var(--teal);color:#fff}
.result.on{display:block}
.result .tot{font-size:2.4rem;font-weight:800;margin:4px 0 14px}
.result small{opacity:.8;text-transform:uppercase;letter-spacing:.6px;font-size:.75rem}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rows div{background:#ffffff1a;border-radius:12px;padding:10px 12px}
.rows b{display:block;font-size:1.15rem;margin-top:2px}
.rows .hl b{color:var(--orange)}
.rrow{display:flex;gap:10px;margin-top:14px}
.rrow button{flex:1;background:#ffffff22;color:#fff;border:0;border-radius:12px;padding:11px;font-weight:600;cursor:pointer}
.hist h2{margin:0 0 10px;font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.hist h2 button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem;text-decoration:underline}
.hist ul{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
.hist li em{font-style:normal;color:var(--muted);font-size:.78rem;display:block}
.hist li b{color:var(--teal);white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hist li b{color:var(--orange)}}
:root[data-theme="dark"] .hist li b{color:var(--orange)}
.empty{color:var(--muted);font-size:.9rem;margin:0}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:6px 14px 24px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--teal2);color:#fff;padding:10px 18px;border-radius:30px;opacity:0;transition:.25s;pointer-events:none;font-size:.9rem}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

    <div><h1>Conversor <span>MIVODA</span></h1><p>Calculadora de lucro por categoria</p></div>
    <button class="theme" id="theme" aria-label="Alternar tema">◐</button>

</header>
<main class="wrap">
  <section class="card">
    <label class="lbl" for="val">Valor do produto</label>
    <div class="money"><b>R$</b><input id="val" inputmode="numeric" autocomplete="off" placeholder="0,00"></div>

    <div class="cats" role="radiogroup" aria-label="Categoria de lucro">
      <label class="cat"><input type="radio" name="cat" value="39"><div><strong>39%</strong><span>Categoria Baixa</span></div></label>
      <label class="cat"><input type="radio" name="cat" value="49"><div><strong>49%</strong><span>Categoria Média</span></div></label>
      <label class="cat"><input type="radio" name="cat" value="52"><div><strong>52%</strong><span>Categoria Excelente</span></div></label>
      <label class="cat"><input type="radio" name="cat" value="59"><div><strong>59%</strong><span>Categoria Alta</span></div></label>
      <label class="cat" style="grid-column:1/-1"><input type="radio" name="cat" value="custom"><div><strong>%</strong><span>Personalizada</span></div></label>
    </div>
    <div class="custom" id="customBox">
      <label class="lbl" for="cust">Porcentagem personalizada</label>
      <div class="money"><input id="cust" inputmode="decimal" autocomplete="off" placeholder="Ex: 45"><b>%</b></div>
    </div>

    <div class="actions">
      <button class="btn sec" id="reset">↺ Resetar</button>
    </div>
  </section>

  <section class="card result" id="result" aria-live="polite">
    <small id="catName">Total</small>
    <div class="tot" id="total">R$ 0,00</div>
    <div class="rows">
      <div><small>Valor original</small><b id="orig">—</b></div>
      <div class="hl"><small id="pctLbl">Lucro</small><b id="profit">—</b></div>
    </div>
    <div class="rrow">
      <button id="copy">📋 Copiar</button>
      <button id="save">💾 Salvar no histórico</button>
    </div>
  </section>

  <section class="card hist">
    <h2>Histórico <button id="clearHist">Limpar</button></h2>
    <ul id="histList"></ul>
    <p class="empty" id="histEmpty">Nenhum cálculo salvo ainda.</p>
  </section>
</main>
<footer>© <span id="yr"></span> MIVODA · Todos os direitos reservados</footer>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const names={39:'Categoria Baixa',49:'Categoria Média',52:'Categoria Excelente',59:'Categoria Alta'};
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let cents=0,cur=null,hist=[];

// Armazenamento seguro
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}

// Máscara: digite 4899 → 48,99
$('val').addEventListener('input',e=>{
  const d=e.target.value.replace(/\D/g,'').slice(0,11);
  cents=d?parseInt(d,10):0;
  e.target.value=d?(cents/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
  calc();
});

function getPct(){
  const r=document.querySelector('input[name=cat]:checked');
  if(!r)return null;
  if(r.value==='custom'){
    const v=parseFloat($('cust').value.replace(',','.'));
    return isNaN(v)||v<=0||v>1000?null:{p:v,name:'Personalizada'};
  }
  return {p:+r.value,name:names[r.value]};
}

// Cálculo em centavos, truncando (ex.: 48,99 × 39% = 19,10 → total 68,09)
function calc(){
  const s=getPct();
  if(!cents||!s){cur=null;$('result').classList.remove('on');return}
  const profit=Math.floor(cents*s.p/100+1e-9);
  cur={cost:cents,p:s.p,name:s.name,profit,total:cents+profit};
  $('catName').textContent='Total · '+s.name;
  $('total').textContent=brl(cur.total);
  $('orig').textContent=brl(cur.cost);
  $('pctLbl').textContent='Lucro ('+String(s.p).replace('.',',')+'%)';
  $('profit').textContent=brl(cur.profit);
  $('result').classList.add('on');
}

document.querySelectorAll('input[name=cat]').forEach(r=>r.addEventListener('change',()=>{
  $('customBox').classList.toggle('on',r.value==='custom'&&r.checked);
  if(r.value==='custom'&&r.checked)$('cust').focus();
  calc();
}));
$('cust').addEventListener('input',calc);

$('reset').onclick=()=>{
  cents=0;cur=null;$('val').value='';$('cust').value='';
  document.querySelectorAll('input[name=cat]').forEach(r=>r.checked=false);
  $('customBox').classList.remove('on');$('result').classList.remove('on');
  $('val').focus();toast('Calculadora resetada');
};

$('copy').onclick=async()=>{
  if(!cur)return;
  const txt=`Total: ${brl(cur.total)} | Lucro (${cur.p}%): ${brl(cur.profit)} | Valor: ${brl(cur.cost)}`;
  try{await navigator.clipboard.writeText(txt);toast('Copiado!')}
  catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copiado!')}catch(_){toast('Não foi possível copiar')}a.remove()}
};

function renderHist(){
  const ul=$('histList');ul.innerHTML='';
  hist.forEach(h=>{
    const li=document.createElement('li');
    const l=document.createElement('div');
    l.textContent=brl(h.cost)+' + '+String(h.p).replace('.',',')+'%';
    const em=document.createElement('em');em.textContent=h.name+' · '+h.date;l.appendChild(em);
    const b=document.createElement('b');b.textContent=brl(h.total);
    li.append(l,b);ul.appendChild(li);
  });
  $('histEmpty').style.display=hist.length?'none':'block';
}
$('save').onclick=()=>{
  if(!cur)return;
  hist.unshift({...cur,date:new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})});
  hist=hist.slice(0,20);save('mivoda_hist',hist);renderHist();toast('Salvo no histórico');
};
$('clearHist').onclick=()=>{hist=[];save('mivoda_hist',hist);renderHist()};

// Tema
function setTheme(t){document.documentElement.dataset.theme=t;save('mivoda_theme',t)}
$('theme').onclick=()=>{
  const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  setTheme(dark?'light':'dark');
};
const th=load('mivoda_theme',null);if(th)document.documentElement.dataset.theme=th;

hist=load('mivoda_hist',[]);if(!Array.isArray(hist))hist=[];
renderHist();
$('yr').textContent=new Date().getFullYear();
</script>
</body>
</html>
